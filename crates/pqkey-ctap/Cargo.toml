[package]
name = "pqkey-ctap"
version = "0.1.0"
description = "FIDO2/CTAP2 authenticator core with post-quantum ML-DSA support"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ciborium.workspace = true
# `zeroize` wipes key schedules and HMAC/SHA-256 state on drop.
aes = { version = "0.9", features = ["zeroize"] }
cbc = { version = "0.2", features = ["alloc", "zeroize"] }
sha2 = { workspace = true, features = ["zeroize"] }
hmac = { version = "0.13", features = ["zeroize"] }
zeroize = { workspace = true, features = ["zeroize_derive"] }
serde = { version = "1", features = ["derive"] }
p256 = { workspace = true, features = ["ecdh"] }
# ECDSA on P-384 (ES384, ESP384), P-521 (ES512, ESP512) and secp256k1
# (ES256K).  They share elliptic-curve and ecdsa with p256.
p384 = { version = "0.14", features = ["ecdsa"] }
p521 = { version = "0.14", features = ["ecdsa"] }
k256 = { version = "0.14", features = ["ecdsa"] }
# EdDSA on Ed25519 (EdDSA and Ed25519).  `zeroize`, a default feature, is
# named because the keys rely on it: it wipes the private key and its hash on
# drop.
ed25519-dalek = { workspace = true, features = ["zeroize"] }
# EdDSA on Ed448 (Ed448), from RustCrypto's only Ed448 crate, a pre-release
# and so pinned exactly.  Its key types are zeroized on drop whatever its
# features; its defaults would add `std`, `getrandom` and `pkcs8`.
ed448-goldilocks = { version = "=0.14.0-pre.15", default-features = false, features = ["signing"] }
# SHAKE256, from which keys kept as a seed derive their ECDSA scalar or Ed448
# private key.  `zeroize` wipes the sponge states that held the seed and what
# it derived.
shake = { workspace = true, features = ["zeroize"] }
# RSA-2048 signatures only. Pin the release candidate; SHA-2's OIDs supply
# PKCS#1 v1.5 DigestInfo. Defaults add std and unused key encodings.
rsa = { version = "=0.10.0-rc.18", default-features = false, features = ["sha2"] }
rand_core.workspace = true
# `SysRng`, the operating system RNG that key generation uses.
getrandom.workspace = true
log.workspace = true
# Credential store: record encryption and constant-time comparison of secrets.
# chacha20poly1305 0.11 shares the cipher 0.5 generation already in the tree;
# its default features only add an RNG convenience the store does not use, and
# `zeroize` (unconditional before 0.11) wipes the key on drop.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
subtle = "2"

# Use our local wrapper for ML-DSA.  By enabling all parameter set features the
# wrapper links to the underlying ML-DSA implementation for 44/65/87.
pqkey-mldsa = { workspace = true, features = ["mldsa44", "mldsa65", "mldsa87"] }

[dev-dependencies]
# Tests derive key pairs from chosen seeds, FIPS 204's internal interface.
pqkey-mldsa = { workspace = true, features = ["mldsa44", "mldsa65", "mldsa87", "hazmat"] }
# The residue test multiplies the base point by an Ed25519 key's scalar.
ed25519-dalek = { workspace = true, features = ["hazmat"] }

# A program of its own: it reads the stack other functions left behind.
[[test]]
name = "residue"
harness = false

[features]
# `verify_signature`, the signature verifier that the tests of pqkey and the
# fuzz targets check signatures with.  The daemon leaves it out.
test-support = []
