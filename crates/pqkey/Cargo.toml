[package]
name = "pqkey"
version = "0.1.0"
description = "FIDO2 security key daemon: a virtual USB-HID authenticator for Linux"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# pthread: only the tests use it, to interrupt one of their threads with a
# signal; a dev-dependency of its own would declare nix twice.
nix = { version = "0.31", default-features = false, features = ["fs", "poll", "process", "pthread", "resource", "signal", "term", "time", "user"] }
signal-hook = { version = "0.4", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
clap-num = "1.0"
log.workspace = true
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
pqkey-ctap.workspace = true
# CTAP2 requests and responses of the command line's client for the running
# key.
ciborium.workspace = true
# CTAPHID channel allocation: the operating system RNG behind rand_core's
# `CryptoRng`, so tests can inject a deterministic one.
rand_core.workspace = true
getrandom.workspace = true
sha2.workspace = true
# Attestation certificate generation. rcgen is built without a crypto backend;
# the certificate is signed with p256, which the CTAP engine already uses.
rcgen.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }
zeroize.workspace = true
# PINs are normalized to NFC before they are checked and sent (CTAP 2.3
# §6.5.1).
unicode-normalization = { version = "0.1.25", default-features = false, features = ["std"] }
[target.'cfg(target_os = "linux")'.dependencies]
# Desktop notifications for user presence, over the D-Bus session bus. Pure
# Rust: zbus's client API on its own runtime, zruntime, which the presence
# thread drives with `zbus::block_on`; nothing else.
zbus = { version = "6.0", default-features = false, features = ["default-rt"] }
# zbus's runtime, for a timer on connecting to the bus, which zbus does not
# limit, and on waiting for a signal.
zruntime = { version = "0.2", default-features = false, features = ["helper"] }
# The `Stream` trait of zbus's signal stream.
futures-core = { version = "0.3", default-features = false }

[dev-dependencies]
# The test verifier, which checks the signatures of the full-stack and
# attestation tests.
pqkey-ctap = { workspace = true, features = ["test-support"] }
# Reads the attestation certificate back independently of rcgen, which wrote it.
x509-parser = "0.18"

# A program of its own: its allocator retains every freed block for scanning.
[[test]]
name = "heap_residue"
harness = false
