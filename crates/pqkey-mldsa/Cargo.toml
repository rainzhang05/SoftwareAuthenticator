[package]
name = "pqkey-mldsa"
version = "0.1.0"
description = "Safe Rust wrapper around pure-Rust ML-DSA (FIPS 204) signatures"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# RustCrypto's ML-DSA.  0.1.0 and later include the fixes for RUSTSEC-2025-0144
# (timing side-channel in Decompose) and GHSA-5x2r-hc65-25f9 (repeated hint
# indices accepted by verification).  `alloc` keeps the large key structures
# off the stack, `rand_core` provides hedged signing, `zeroize` wipes keys on
# drop.  The default `pkcs8` and `getrandom` features are not needed.
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
# The operating system RNG: key-generation seeds and the hedged-signing `rnd`.
getrandom.workspace = true
zeroize = { workspace = true, features = ["zeroize_derive"] }
# Optional: without it `sign()`'s empty-Vec failure path is completely silent.
log = { workspace = true, optional = true }

[features]
# Enable specific ML-DSA parameter sets.  All three are enabled by default.
# `log` is also on by default so that signing failures are not silent; build
# with `default-features = false` to drop it.
default = ["mldsa44", "mldsa65", "mldsa87", "log"]
mldsa44 = []
mldsa65 = []
mldsa87 = []
log = ["dep:log"]
