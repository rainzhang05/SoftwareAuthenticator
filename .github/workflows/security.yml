name: Security

# Supply-chain auditing, split out from CI on purpose: these checks depend on
# the state of the RustSec advisory database, not on the state of this repo, so
# they have to run on a timer as well as on commits. A new advisory against
# any dependency must turn something red even in a week with no pushes.
#
# Both jobs check two dependency graphs: the main workspace (Cargo.lock) and
# the fuzz crate, a workspace of its own with its own fuzz/Cargo.lock. The fuzz
# targets are not shipped, but they build and run on CI runners and developer
# machines, so a compromised or vulnerable crate there matters too.
#
# fuzz/Cargo.lock is handled as in fuzz.yml and ci.yml, by
# .github/scripts/sync-fuzz-lockfile.sh: on pull requests it must be up to date
# as committed, and cargo deny's --locked fails the check otherwise. Elsewhere
# (pushes to main, the weekly scan) a lockfile left behind by a change to a
# workspace manifest is brought up to date first, with a warning, and the
# result is what gets checked: it is the graph fuzz.yml builds and fuzzes on
# those events, and a stale lockfile is a chore to commit, not a supply-chain
# finding that should turn Security red or stop the weekly advisory scan of
# the fuzz crate from running at all.
#
# Neither job compiles anything - cargo-audit reads Cargo.lock directly and
# cargo-deny only needs `cargo metadata` - so they need no system packages, no
# build cache, and finish in well under a minute.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 06:17 UTC. Offset from the hour because GitHub drops scheduled
    # runs that pile up on exact-hour boundaries.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  # RustSec advisories against the committed Cargo.lock. cargo-audit runs with
  # its own defaults: vulnerabilities fail the job, unmaintained/unsound
  # advisories are printed as warnings. It is the human-readable report;
  # deny.toml's [advisories] section is the strict gate (see the `deny` job).
  #
  # cargo-audit parses Cargo.lock as-is and never re-resolves, so `--locked` is
  # implicit - it is auditing exactly what CI and releases build.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2
        with:
          tool: cargo-audit

      # No vulnerability is ignored: any advisory against the locked tree fails
      # this job. deny.toml lists the non-vulnerability findings that are
      # tolerated.
      - name: Audit dependencies
        run: cargo audit

      - name: Check fuzz/Cargo.lock
        if: ${{ !cancelled() }}
        env:
          TOOLCHAIN: stable
        run: .github/scripts/sync-fuzz-lockfile.sh

      - name: Audit the fuzz crate's dependencies
        if: ${{ !cancelled() }}
        run: cargo audit --file fuzz/Cargo.lock

  # cargo-deny: advisories, licenses, banned/duplicated crates, and source
  # provenance. This is the strict half of the pair - see deny.toml, which
  # documents every tolerated finding with a TODO for removing it.
  #
  # `sources` in particular matters here: it guarantees that crates.io stays
  # the *only* input to the build, with no git dependency or patch.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2
        with:
          # Version-pinned deliberately: cargo-deny's config schema changes
          # between minor releases and a silent bump would break deny.toml.
          # Bump this and deny.toml together.
          tool: cargo-deny@0.20.2

      # `--all-features` is already set via [graph] in deny.toml, so the four
      # check names are the whole command.
      - name: Check advisories, licenses, bans and sources
        run: cargo deny --locked check advisories bans licenses sources

      - name: Check fuzz/Cargo.lock
        if: ${{ !cancelled() }}
        env:
          TOOLCHAIN: stable
        run: .github/scripts/sync-fuzz-lockfile.sh

      # The fuzz crate has no deny.toml of its own; cargo-deny finds the root
      # one, so both graphs are held to the same policy. --locked holds it to
      # the lockfile as committed (on pull requests) or as the step above left
      # it (elsewhere).
      - name: Check the fuzz crate
        if: ${{ !cancelled() }}
        run: cargo deny --manifest-path fuzz/Cargo.toml --locked check advisories bans licenses sources
