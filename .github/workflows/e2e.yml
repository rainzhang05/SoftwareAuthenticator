name: E2E

# End-to-end test of the daemon as a security key: pc-hid-runner creates a real
# virtual USB-HID device through the kernel's uhid driver, and real FIDO
# clients (libfido2's command-line tools and python-fido2) talk CTAPHID and
# CTAP2 to it through the hidraw node the kernel creates for it.
#
# This needs a Linux kernel with uhid, so it only runs on GitHub's Ubuntu
# runners. To reproduce it on a Linux machine, follow the steps below: build
# pc-hid-runner, attach it in the foreground, point E2E_HIDRAW at its hidraw
# node, then run tests/e2e/libfido2.sh and pytest tests/e2e.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  e2e:
    name: virtual security key
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Install system dependencies
        # fido2-tools: libfido2's fido2-token/fido2-cred/fido2-assert clients.
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libclang-dev fido2-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Release mode, as the daemon ships.
      - name: Build pc-hid-runner
        run: cargo build -p pc-hid-runner --locked --release

      # The daemon and the clients run as the unprivileged job user, the way
      # the authenticator is meant to be used, rather than as root: a root
      # daemon would hide permission problems, and there is no reason to run
      # test code from PyPI as root. A CI-only udev rule gives this user
      # /dev/uhid and the hidraw node of the virtual key (and nothing else).
      # The shipped contrib/udev rule is not used because it grants the node
      # through "uaccess", which needs a logged-in seat that a runner lacks.
      - name: Load uhid and grant the job user access
        run: |
          user=$(id -un)
          sudo tee /etc/udev/rules.d/99-e2e-virtual-key.rules >/dev/null <<EOF
          KERNEL=="uhid", SUBSYSTEM=="misc", OWNER="$user", MODE="0600"
          SUBSYSTEM=="hidraw", DEVPATH=="/devices/virtual/misc/uhid/0003:096E:0858.*", OWNER="$user", MODE="0600"
          EOF
          sudo udevadm control --reload-rules
          if ! sudo modprobe uhid; then
            # The runners' azure kernel ships uhid in the extra modules package
            # rather than in the base image.
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe uhid
          fi
          # Applies the rule even if uhid was already loaded before it existed.
          sudo udevadm trigger --action=change --name-match=uhid --settle
          ls -l /dev/uhid
          if [ ! -r /dev/uhid ] || [ ! -w /dev/uhid ]; then
            echo "::error::/dev/uhid is not accessible to $user"
            exit 1
          fi

      - name: Attach the virtual security key
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-diagnostics"
          state_dir="$RUNNER_TEMP/authenticator-state"
          status_file="$RUNNER_TEMP/authenticator.status"
          log="$RUNNER_TEMP/e2e-diagnostics/authenticator.log"
          echo "E2E_STATE_DIR=$state_dir" >> "$GITHUB_ENV"

          # The subshell records the daemon's exit status for the detach step.
          # All standard streams are redirected so this step does not wait for
          # the background process to close them.
          (
            status=0
            RUST_LOG=info,pc_hid_runner=debug target/release/pc-hid-runner \
              attach --foreground --state-dir "$state_dir" || status=$?
            echo "$status" > "$status_file"
          ) </dev/null >"$log" 2>&1 &

          # Poll for the hidraw node the kernel creates for the device, and
          # for udev to hand it to this user.
          deadline=$((SECONDS + 60))
          node=
          while :; do
            if [ -e "$status_file" ]; then
              echo "::error::pc-hid-runner exited with status $(cat "$status_file") before the device was ready"
              cat "$log"
              exit 1
            fi
            if [ -z "$node" ]; then
              for sys in /sys/devices/virtual/misc/uhid/0003:096E:0858.*/hidraw/hidraw*; do
                [ -e "$sys" ] && node="/dev/${sys##*/}"
              done
            fi
            if [ -n "$node" ] && [ -r "$node" ] && [ -w "$node" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::no accessible hidraw node for the virtual key after 60s (node: ${node:-none})"
              ls -l /dev/hidraw* || true
              cat "$log"
              exit 1
            fi
            sleep 0.1
          done

          echo "Virtual security key: $node"
          ls -l "$node"
          udevadm info --query=all --name="$node" | tee "$RUNNER_TEMP/e2e-diagnostics/udevadm-hidraw.txt"
          echo "E2E_HIDRAW=$node" >> "$GITHUB_ENV"

      - name: libfido2 tests
        run: tests/e2e/libfido2.sh "$E2E_HIDRAW"

      - name: Set up Python
        if: success() || failure()
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install Python test dependencies
        if: success() || failure()
        # Every package is pinned with its hashes; wheels only, so nothing
        # from PyPI runs at install time.
        run: |
          python -m venv "$RUNNER_TEMP/e2e-venv"
          "$RUNNER_TEMP/e2e-venv/bin/python" -m pip install --require-hashes --only-binary :all: \
            -r tests/e2e/requirements.txt
      # Runs even if the libfido2 tests failed: the two clients are independent.
      - name: python-fido2 tests
        if: (success() || failure()) && env.E2E_HIDRAW != ''
        run: |
          "$RUNNER_TEMP/e2e-venv/bin/python" -m pytest tests/e2e -v \
            --junitxml="$RUNNER_TEMP/e2e-diagnostics/pytest-junit.xml"

      - name: Detach the virtual security key
        if: always() && env.E2E_STATE_DIR != ''
        run: |
          status_file="$RUNNER_TEMP/authenticator.status"
          started=$SECONDS
          target/release/pc-hid-runner detach --state-dir "$E2E_STATE_DIR"

          # detach returns once the daemon has released its lock; its exit
          # status follows immediately.
          deadline=$((started + 5))
          until [ -e "$status_file" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::pc-hid-runner did not exit within 5s of detach"
              exit 1
            fi
            sleep 0.1
          done
          status=$(cat "$status_file")
          echo "pc-hid-runner exited with status $status after $((SECONDS - started))s"
          if [ "$status" != 0 ]; then
            echo "::error::pc-hid-runner exited with status $status"
            exit 1
          fi

          until ! compgen -G "/sys/devices/virtual/misc/uhid/0003:096E:0858.*" >/dev/null \
            && { [ -z "${E2E_HIDRAW:-}" ] || [ ! -e "$E2E_HIDRAW" ]; }; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the virtual key's device is still present after detach"
              ls -l /dev/hidraw* || true
              exit 1
            fi
            sleep 0.1
          done
          echo "The virtual key's hidraw node is gone"

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-diagnostics"
          sudo dmesg > "$RUNNER_TEMP/e2e-diagnostics/dmesg.txt" 2>&1 || true
          {
            ls -l /dev/uhid /dev/hidraw* 2>&1
            udevadm info --query=all --name=uhid 2>&1
          } > "$RUNNER_TEMP/e2e-diagnostics/devices.txt" || true
          cp "$RUNNER_TEMP/authenticator.status" "$RUNNER_TEMP/e2e-diagnostics/" 2>/dev/null || true
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-diagnostics
          path: ${{ runner.temp }}/e2e-diagnostics
          retention-days: 14
