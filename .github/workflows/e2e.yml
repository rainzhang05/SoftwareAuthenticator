name: E2E

# End-to-end test of the daemon as a security key: pqkey creates a real
# virtual USB-HID device through the kernel's uhid driver, and real FIDO
# clients (libfido2's command-line tools and python-fido2) talk CTAPHID and
# CTAP2 to it through the hidraw node the kernel creates for it.
#
# This needs a Linux kernel with uhid, so it only runs on GitHub's Ubuntu
# runners. To reproduce it on a Linux machine, follow the steps below: build
# pqkey, attach it in the foreground, point E2E_HIDRAW at its hidraw
# node, then run tests/e2e/libfido2.sh and pytest tests/e2e.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  e2e:
    name: virtual security key
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Install system dependencies
        # fido2-tools: libfido2's fido2-token/fido2-cred/fido2-assert clients.
        # dbus-daemon: the session bus the presence notification tests use.
        run: |
          sudo apt-get update
          sudo apt-get install -y fido2-tools dbus-daemon
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Release mode, as the daemon ships.
      - name: Build pqkey
        run: cargo build -p pqkey --locked --release

      # The daemon and the clients run as the unprivileged job user, the way
      # the authenticator is meant to be used, rather than as root: a root
      # daemon would hide permission problems, and there is no reason to run
      # test code from PyPI as root. A CI-only udev rule gives this user
      # /dev/uhid and the hidraw node of the virtual key (and nothing else).
      # The shipped contrib/udev rule is not used because it grants the node
      # through "uaccess", which needs a logged-in seat that a runner lacks.
      - name: Load uhid and grant the job user access
        run: |
          user=$(id -un)
          sudo tee /etc/udev/rules.d/99-e2e-virtual-key.rules >/dev/null <<EOF
          KERNEL=="uhid", SUBSYSTEM=="misc", OWNER="$user", MODE="0600"
          SUBSYSTEM=="hidraw", DEVPATH=="/devices/virtual/misc/uhid/0003:1209:000[1-4].*", OWNER="$user", MODE="0600"
          EOF
          sudo udevadm control --reload-rules
          if ! sudo modprobe uhid; then
            # The runners' azure kernel ships uhid in the extra modules package
            # rather than in the base image.
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe uhid
          fi
          # Applies the rule even if uhid was already loaded before it existed.
          sudo udevadm trigger --action=change --name-match=uhid --settle
          ls -l /dev/uhid
          if [ ! -r /dev/uhid ] || [ ! -w /dev/uhid ]; then
            echo "::error::/dev/uhid is not accessible to $user"
            exit 1
          fi

      # Each virtual key is a pqkey instance of its own, told apart by its
      # product ID, one of the pid.codes test product IDs 0001 to 0004 under
      # the pid.codes vendor ID 1209; tests/e2e/daemon.sh starts and stops them.
      - name: Attach the virtual security key
        run: |
          echo "E2E_WORK=$RUNNER_TEMP" >> "$GITHUB_ENV"
          export E2E_WORK=$RUNNER_TEMP
          node=$(tests/e2e/daemon.sh start auto-approve 0001 --presence auto-approve --allow-late-reset)
          echo "E2E_HIDRAW=$node" >> "$GITHUB_ENV"

      # The same with certificate attestation, for the attestation certificate
      # tests.
      - name: Attach the certificate key
        run: |
          node=$(tests/e2e/daemon.sh start certificate 0002 --presence auto-approve --allow-late-reset \
            --attestation certificate --manufacturer "pqkey E2E" --product "pqkey E2E key" --country US)
          echo "E2E_CERTIFICATE_HIDRAW=$node" >> "$GITHUB_ENV"

      # A session bus of the tests' own, with no notification server on it
      # until a test starts its fake one (tests/e2e/notifications.py).
      - name: Start a D-Bus session bus
        run: |
          address="unix:path=$E2E_WORK/session-bus"
          dbus-daemon --config-file=tests/e2e/session-bus.conf --address="$address" \
            --fork --print-pid > "$E2E_WORK/session-bus.pid"
          echo "DBUS_SESSION_BUS_ADDRESS=$address" >> "$GITHUB_ENV"

      # Asks for presence with desktop notifications on that bus. A short
      # presence timeout keeps the test of an unanswered prompt quick. No
      # --allow-late-reset: with notifications a reset is accepted at any time.
      - name: Attach the notify key
        run: |
          node=$(tests/e2e/daemon.sh start notify 0003 --presence notify --presence-timeout 3)
          echo "E2E_NOTIFY_HIDRAW=$node" >> "$GITHUB_ENV"

      # Asks for presence and never gets an answer, so tests can watch the
      # transport while a prompt is showing.
      - name: Attach the unanswered key
        run: |
          node=$(tests/e2e/daemon.sh start unanswered 0004 --presence unanswered)
          echo "E2E_UNANSWERED_HIDRAW=$node" >> "$GITHUB_ENV"

      - name: libfido2 tests
        run: tests/e2e/libfido2.sh "$E2E_HIDRAW"

      - name: Set up Python
        if: success() || failure()
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install Python test dependencies
        if: success() || failure()
        # Every package is pinned with its hashes; wheels only, so nothing
        # from PyPI runs at install time.
        run: |
          python -m venv "$RUNNER_TEMP/e2e-venv"
          "$RUNNER_TEMP/e2e-venv/bin/python" -m pip install --require-hashes --only-binary :all: \
            -r tests/e2e/requirements.txt
      # Runs even if the libfido2 tests failed: the two clients are independent.
      - name: python-fido2 tests
        if: (success() || failure()) && env.E2E_HIDRAW != ''
        run: |
          "$RUNNER_TEMP/e2e-venv/bin/python" -m pytest tests/e2e -v \
            --junitxml="$RUNNER_TEMP/e2e-diagnostics/pytest-junit.xml"

      - name: Detach the virtual security keys
        if: always() && env.E2E_WORK != ''
        run: |
          failed=0
          tests/e2e/daemon.sh stop auto-approve 0001 || failed=1
          if [ -n "${E2E_CERTIFICATE_HIDRAW:-}" ]; then
            tests/e2e/daemon.sh stop certificate 0002 || failed=1
          fi
          if [ -n "${E2E_NOTIFY_HIDRAW:-}" ]; then
            tests/e2e/daemon.sh stop notify 0003 || failed=1
          fi
          if [ -n "${E2E_UNANSWERED_HIDRAW:-}" ]; then
            tests/e2e/daemon.sh stop unanswered 0004 || failed=1
          fi
          if [ -e "$E2E_WORK/session-bus.pid" ]; then
            kill "$(cat "$E2E_WORK/session-bus.pid")" || true
          fi
          exit "$failed"

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-diagnostics"
          sudo dmesg > "$RUNNER_TEMP/e2e-diagnostics/dmesg.txt" 2>&1 || true
          {
            ls -l /dev/uhid /dev/hidraw* 2>&1
            udevadm info --query=all --name=uhid 2>&1
          } > "$RUNNER_TEMP/e2e-diagnostics/devices.txt" || true
          cp "$RUNNER_TEMP"/*.status "$RUNNER_TEMP/e2e-diagnostics/" 2>/dev/null || true
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-diagnostics
          path: ${{ runner.temp }}/e2e-diagnostics
          retention-days: 14
