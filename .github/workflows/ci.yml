name: CI

# The whole workspace builds and runs its unit tests on macOS too, but the
# daemon only works on Linux (it creates the virtual key through /dev/uhid).
# ubuntu-latest is therefore the platform that matters, and this workflow is the
# authoritative gate for the project rather than a convenience.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 07:17 UTC, after Dependabot (05:00) and the security scan (06:17).
    # Catches breakage from new stable Rust releases in weeks with no pushes.
    - cron: "17 7 * * 1"
  workflow_dispatch:

# Least privilege by default; each job re-states what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs. Pushes to main are allowed to finish so every
  # commit on main keeps an attributable result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless across fresh CI runners and bloat the cache.
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  # Formatting. Cheap and deterministic, so it runs without a cache or any
  # system packages. `cargo fmt` never touches the dependency graph, which is
  # why this is the one job with no `--locked`.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # The Python tests of the Dependabot auto-merge decision
  # (.github/scripts/test_dependabot_automerge.py). The runner image has
  # python3, bash and jq.
  automerge-scripts:
    name: auto-merge scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  # Lints: any clippy or rustc warning fails the job, including the workspace
  # lints in the root Cargo.toml and the crate-level ones in each crate root.
  # A finding that is deliberately kept carries an `#[allow]` with a comment
  # saying why.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLIPPY_FLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --workspace --all-targets --locked -- ${{ env.CLIPPY_FLAGS }}

  # The main correctness gate: the full workspace on Linux, the platform where
  # the pqkey daemon actually runs.
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Test
        run: cargo test --workspace --locked --all-targets

      # `--all-targets` silently excludes doctests, so run them explicitly.
      - name: Doctests
        run: cargo test --workspace --locked --doc

      # Every feature combination of every crate, not just "all on". pqkey-mldsa
      # dispatches per parameter set behind cfg(feature), so a build with one set
      # compiled out is exactly where a silent break would otherwise hide until a
      # downstream user tried it.
      - name: Install cargo-hack
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-hack
      - name: Check every feature combination
        run: cargo hack check --workspace --locked --all-targets --feature-powerset

      # Dependencies whose code a future rustc will reject outright (none at the
      # moment). Surfaced in the job summary so that day arrives as a known
      # deadline rather than a sudden build failure. Informational only.
      - name: Future-incompatibility report
        if: always()
        run: |
          {
            echo '### Future-incompatibility report'
            echo ''
            echo '```'
            cargo report future-incompatibilities 2>&1 || echo 'No report was generated for this build.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The root Cargo.toml declares the minimum supported Rust version under
  # [workspace.package]. This job is what makes that declaration true: it reads
  # the version from Cargo.toml (so there is exactly one place to change it) and
  # fails if the workspace or its locked dependency graph stops building on it.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(sed -nE 's/^rust-version *= *"([^"]+)".*/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::no rust-version found in [workspace.package]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV is $version"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check workspace on the declared MSRV
        # rust-toolchain.toml pins `stable` for local development and outranks
        # rustup's default toolchain; RUSTUP_TOOLCHAIN outranks the file.
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --workspace --locked --all-targets

  # Rustdoc, with warnings denied. Catches broken intra-doc links and malformed
  # doc attributes, which are easy to introduce and invisible until someone
  # builds the docs. Built twice: the public API as a reader of the crates sees
  # it (where a link to a private item is an error), and with private items,
  # which is most of the documentation in a daemon.
  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --workspace --locked --no-deps --all-features
      - run: cargo doc --workspace --locked --no-deps --all-features --document-private-items

  # pqkey ships as a release-mode daemon. Debug and release differ in
  # ways that matter here (overflow checks, debug_assert!, LTO/codegen), and
  # nothing else in this pipeline ever links a release binary.
  build-release:
    name: release build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --workspace --locked --release

  # Coverage. Reported, never enforced: parts of pqkey (the uhid device
  # and the CLI) cannot be exercised by unit tests, so any threshold would either
  # be meaningless or permanently red. The
  # point for now is to make the number visible on every run so the trend is
  # obvious.
  #
  # Deliberately no third-party upload (Codecov/Coveralls): those need a token
  # this repo does not have. The lcov file is attached as a build artifact and
  # the summary is printed into the job log instead.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-llvm-cov

      - name: Collect coverage
        run: cargo llvm-cov --workspace --locked --all-features --all-targets --no-report

      - name: Generate reports
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage-html

      - name: Publish summary
        run: |
          {
            echo '### Coverage'
            echo ''
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # TODO: once the number stops moving, add a
      # floor with `--fail-under-lines <N>` on the `report` invocation above and
      # this job becomes a real gate.

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            lcov.info
            coverage-html
          retention-days: 14
