version: 2

# Automated dependency updates. This is the piece that keeps the project moving
# on its own: the pipeline in .github/workflows/ is what makes it safe to merge
# what Dependabot opens.
#
# Because Cargo.lock is committed and every CI invocation passes --locked,
# Dependabot updates the lockfile in its PRs and CI verifies that exact
# resolution. Without the committed lockfile these PRs would be unverifiable.

updates:
  # ----------------------------------------------------------------------
  # Rust dependencies
  # ----------------------------------------------------------------------
  # Patch and minor bumps arrive as a single weekly PR so the queue stays
  # reviewable. Major bumps are deliberately left out of the group: in this
  # tree they are typically cross-crate breaking changes in cryptographic code
  # (e.g. the RustCrypto digest 0.10 -> 0.11 generation, which sha2, hmac, hkdf,
  # aes and cbc must cross together), and each deserves its own review.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    # Ahead of the Monday 06:17 UTC scheduled security scan, so an advisory and
    # its fix tend to show up in the same window once the fix is past the
    # cooldown.
    open-pull-requests-limit: 5
    # Dependabot waits until a release is 7 days old before updating to it (3
    # days without this setting): .github/scripts/dependabot-automerge.sh can
    # merge these PRs without review, and users install from `stable`, which
    # follows main, so the wait gives a compromised or broken release time to
    # be noticed first. It does not hold back the newer versions Cargo may pick
    # for packages already in the lockfile that an update needs.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The fuzz crate (fuzz/) is a workspace of its own with its own lockfile,
  # which the entry above never touches. Same schedule, grouping and cooldown.
  # Its PRs are auto-merged under the same rules once the Fuzz workflow, the
  # only one that builds this lockfile, has built and run every target with it.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(fuzz)"
    groups:
      fuzz-cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ----------------------------------------------------------------------
  # GitHub Actions
  # ----------------------------------------------------------------------
  # The workflows pin third-party actions to commit SHAs with a `# v4`-style
  # comment next to each one. Dependabot understands that form and rewrites both
  # the SHA and the comment, so pinning costs nothing in maintenance.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
