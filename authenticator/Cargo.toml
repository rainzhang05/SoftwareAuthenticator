[package]
name = "authenticator"
version = "0.1.0"
edition = "2021"

description = "FIDO2/CTAP2 authenticator core with post-quantum ML-DSA support"
authors = ["Feitian Technologies <info@ftsafe.com>"]
license = "Apache-2.0 OR MIT"

[dependencies]
ciborium = { version = "0.2", default-features = false, features = ["std"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
zeroize = { version = "1", features = ["zeroize_derive"] }
serde = { version = "1", features = ["derive"] }
ctaphid-app = "0.1"
# `InterruptFlag`, through which the CTAPHID dispatcher cancels a request.
trussed-core = "0.1"
heapless-bytes = "0.3"
p256 = { version = "0.13", features = ["ecdh"] }
# `getrandom` provides `OsRng`, which key generation uses.
rand_core = { version = "0.6", features = ["getrandom"] }
log = { version = "0.4", default-features = false }
# Credential store: record encryption and constant-time comparison of secrets.
# chacha20poly1305 0.10 shares the cipher 0.4 generation already in the tree;
# its default features only add an RNG convenience the store does not use.
chacha20poly1305 = { version = "0.10", default-features = false }
subtle = "2"

# Use our local wrapper for ML-DSA.  By enabling all parameter set features the
# wrapper links to the underlying ML-DSA implementation for 44/65/87.
trussed-mldsa = { path = "../trussed-mldsa", features = ["mldsa44", "mldsa65", "mldsa87"] }