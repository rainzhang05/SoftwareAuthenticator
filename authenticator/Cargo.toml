[package]
name = "authenticator"
version = "0.1.0"
edition = "2021"

description = "FIDO2/CTAP2 authenticator core with post-quantum ML-DSA support"
authors = ["Feitian Technologies <info@ftsafe.com>"]
license = "Apache-2.0 OR MIT"

[dependencies]
trussed = "0.1.0"
ciborium = { version = "0.2", default-features = false }
heapless = "0.7"
littlefs2 = "0.4"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
zeroize = { version = "1", features = ["zeroize_derive"] }
serde = { version = "1", features = ["derive"] }
ctaphid-app = "0.1"
heapless-bytes = "0.3"
p256 = { version = "0.13", features = ["ecdh"] }
rand_core = "0.6"
log = { version = "0.4", default-features = false }
transport-core = { path = "../transport-core", default-features = false }

# Use our local wrapper for ML-DSA.  By enabling all parameter set features the
# wrapper links to the underlying ML-DSA implementation for 44/65/87.
trussed-mldsa = { path = "../trussed-mldsa", features = ["mldsa44", "mldsa65", "mldsa87"] }

[dev-dependencies]
serial_test = "2"