[workspace]
members = [
    "crates/pqkey-mldsa",
    "crates/pqkey-ctap",
    "crates/pqkey",
]

resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Rain Zhang"]
repository = "https://github.com/rainzhang05/SoftwareAuthenticator"
readme = "README.md"
# The newest `rust-version` in the locked dependency graph: aes 0.9.3.
rust-version = "1.89"

# Dependencies declared more than once, by more than one member or by one as
# both a dependency and a dev-dependency, declared once here so their versions
# cannot drift apart. Members add the features they need on top; a crate
# declared once stays in its member's manifest.
[workspace.dependencies]
ciborium = { version = "0.2", default-features = false, features = ["std"] }
ed25519-dalek = "3.0"
getrandom = { version = "0.4", features = ["sys_rng"] }
log = { version = "0.4", default-features = false }
p256 = "0.14"
pqkey-ctap = { path = "crates/pqkey-ctap" }
pqkey-mldsa = { path = "crates/pqkey-mldsa" }
rand_core = "0.10"
sha2 = "0.11"
shake = { version = "0.1", default-features = false }
zeroize = "1"

# Lints every member inherits with `[lints] workspace = true`. Crate-specific
# ones (`forbid(unsafe_code)`, `missing_docs`, safety comments on `unsafe`)
# are attributes at the top of each crate root.
[workspace.lints.rust]
# `std::fmt::Result` where `fmt::Result` is already in scope: noise in review
# and a sign of imports that drifted.
unused_qualifications = "warn"
