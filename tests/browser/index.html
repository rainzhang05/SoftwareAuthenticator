<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pqkey test RP</title>
<style>
  :root { --bg:#fbfbf9; --fg:#1d1d1b; --muted:#6b6b66; --line:#d9d8d2; --card:#fff; --pass:#1a7f37; --fail:#c62828; --warn:#9a6700; --accent:#2856c4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ececea; --muted:#a3a39d; --line:#3a3a37; --card:#1f1f1e; --pass:#4ac26b; --fail:#ff7b72; --warn:#d29922; --accent:#7aa2f7; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  header .ua { color:var(--muted); font-size:12px; }
  main { display:grid; grid-template-columns: minmax(320px, 430px) 1fr; gap:16px; padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:16px; }
  h2 { font-size:14px; margin:0 0 8px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  label { display:block; margin:6px 0 2px; font-size:12px; color:var(--muted); }
  input[type=text], select { width:100%; padding:5px 6px; border:1px solid var(--line); border-radius:5px; background:var(--bg); color:var(--fg); font:inherit; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .cb { display:flex; gap:6px; align-items:center; margin:4px 0; font-size:13px; color:var(--fg); }
  button { font:inherit; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .presets { display:grid; grid-template-columns: 1fr; gap:4px; max-height: 360px; overflow:auto; }
  .presets button { text-align:left; font-size:12.5px; padding:4px 8px; }
  .presets b { display:inline-block; min-width:34px; }
  pre { white-space:pre-wrap; word-break:break-all; font:12px/1.4 ui-monospace, monospace; margin:0; max-height:520px; overflow:auto; }
  .PASS { color:var(--pass); font-weight:600; } .FAIL { color:var(--fail); font-weight:600; } .ERR { color:var(--warn); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  td, th { border-bottom:1px solid var(--line); padding:4px 6px; text-align:left; vertical-align:top; }
  td.mono { font-family: ui-monospace, monospace; font-size:11.5px; }
  #status { font-weight:600; }
  .log div { border-bottom:1px solid var(--line); padding:3px 0; font-size:12.5px; }
</style>
</head>
<body>
<header>
  <h1>pqkey test RP</h1>
  <span>RP ID <code>localhost</code></span>
  <span id="status">idle</span>
  <label class="cb" style="margin:0"><input type="checkbox" id="remote" checked><span>remote control (tester queues tests)</span></label>
  <span class="ua" id="ua"></span>
</header>
<main>
<div>
  <section>
    <h2>Presets (click = load + run)</h2>
    <div class="presets" id="presets"></div>
  </section>
  <section>
    <h2>Ceremony</h2>
    <label>Test label</label><input type="text" id="label">
    <div class="row">
      <div><label>Username</label><input type="text" id="username" value="alice"></div>
      <div><label>Algorithms (RP order, COSE IDs)</label><input type="text" id="algs" value="-7"></div>
    </div>
    <div class="row">
      <div><label>residentKey</label><select id="rk"><option>discouraged</option><option>preferred</option><option>required</option></select></div>
      <div><label>userVerification</label><select id="uv"><option>discouraged</option><option>preferred</option><option>required</option></select></div>
    </div>
    <div class="row">
      <div><label>attestation</label><select id="att"><option value="">(default)</option><option>none</option><option>indirect</option><option>direct</option><option>enterprise</option></select></div>
      <div><label>attachment</label><select id="attach"><option>cross-platform</option><option value="">(none)</option><option>platform</option></select></div>
    </div>
    <div class="row">
      <div><label>hints</label><input type="text" id="hints" value="security-key"></div>
      <div><label>timeout ms</label><input type="text" id="timeout" value="60000"></div>
    </div>
    <div class="cb"><input type="checkbox" id="credProps" checked><span>credProps</span></div>
    <div class="cb"><input type="checkbox" id="prf"><span>PRF at registration</span></div>
    <div class="row">
      <div><label>PRF salt 1 (text, hashed)</label><input type="text" id="prfSalt1"></div>
      <div><label>PRF salt 2</label><input type="text" id="prfSalt2"></div>
    </div>
    <div class="row">
      <div><label>credentialProtectionPolicy</label><select id="credProtect"><option value="">(none)</option><option>userVerificationOptional</option><option>userVerificationOptionalWithCredentialIDList</option><option>userVerificationRequired</option></select></div>
      <div><label>&nbsp;</label><div class="cb"><input type="checkbox" id="enforce"><span>enforce</span></div></div>
    </div>
    <div class="cb"><input type="checkbox" id="exclude"><span>excludeCredentials = this user's credentials</span></div>
    <label>Sign-in allowCredentials</label>
    <select id="allow"><option value="user">all of this user's credentials</option><option value="empty">empty (discoverable / account picker)</option></select>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="btnReg">Register</button>
      <button class="primary" id="btnLogin">Sign in</button>
      <button id="btnAbort" disabled>Abort (AbortController)</button>
    </div>
  </section>
</div>
<div>
  <section>
    <h2>Last result</h2>
    <pre id="result">—</pre>
  </section>
  <section>
    <h2>Credentials at this RP</h2>
    <div id="creds"></div>
  </section>
  <section>
    <h2>Recent results (server log)</h2>
    <div class="log" id="log"></div>
  </section>
</div>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
$('ua').textContent = navigator.userAgent;
// The names of the algorithms, as in ALGORITHMS in tests/e2e/ctap.py.
const NAMES = {'-7':'ES256','-48':'ML-DSA-44','-49':'ML-DSA-65','-50':'ML-DSA-87','-9':'ESP256','-35':'ES384','-51':'ESP384','-36':'ES512','-52':'ESP512','-47':'ES256K','-8':'EdDSA','-19':'Ed25519','-53':'Ed448','-257':'RS256','-258':'RS384','-259':'RS512','-37':'PS256','-38':'PS384','-39':'PS512','-265':'ESB256','-267':'ESB384'};

const PRESETS = await (await fetch("/presets.json")).json();

let fixtureId = null;
let expectedCredential = null;
function setForm(p) {
  fixtureId = p.fixtureId || p.id || null;
  expectedCredential = p.expectedCredential || null;
  $('label').value = `${p.id} ${p.label}`;
  $('username').value = p.username ?? 'alice';
  $('algs').value = p.algs ?? '-7';
  $('rk').value = p.rk ?? 'discouraged';
  $('uv').value = p.uv ?? 'discouraged';
  $('att').value = p.att ?? '';
  $('attach').value = p.attach ?? 'cross-platform';
  $('hints').value = p.hints ?? 'security-key';
  $('credProps').checked = p.credProps ?? true;
  $('prf').checked = !!p.prf;
  $('prfSalt1').value = p.prfSalt1 ?? '';
  $('prfSalt2').value = p.prfSalt2 ?? '';
  $('credProtect').value = p.credProtect ?? '';
  $('enforce').checked = !!p.enforce;
  $('exclude').checked = !!p.exclude;
  if (p.allow?.startsWith('cred:') && !Array.from($('allow').options).some(o => o.value === p.allow)) {
    $('allow').add(new Option('fixture credential', p.allow));
  }
  $('allow').value = p.allow ?? 'user';
  $('timeout').value = p.timeout ?? 60000;
}
function readForm() {
  const hints = $('hints').value.split(',').map(s => s.trim()).filter(Boolean);
  return {
    fixtureId, expectedCredential, label: $('label').value, username: $('username').value,
    algs: $('algs').value.split(',').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n)),
    residentKey: $('rk').value, userVerification: $('uv').value, attestation: $('att').value,
    attachment: $('attach').value, hints, timeout: $('timeout').value,
    credProps: $('credProps').checked, prf: $('prf').checked,
    prfSalt1: $('prfSalt1').value, prfSalt2: $('prfSalt2').value,
    credProtect: $('credProtect').value, enforceCredProtect: $('enforce').checked,
    excludeExisting: $('exclude').checked, allow: $('allow').value,
  };
}

const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf instanceof ArrayBuffer ? buf : buf.buffer))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u = (s) => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0)).buffer;
function extToJSON(x) {
  if (x instanceof ArrayBuffer || ArrayBuffer.isView(x)) return b64u(x);
  if (Array.isArray(x)) return x.map(extToJSON);
  if (x && typeof x === 'object') { const o = {}; for (const k in x) o[k] = extToJSON(x[k]); return o; }
  return x;
}
function decodePrf(ext) {
  if (ext && ext.prf && ext.prf.eval) { for (const k of ['first','second']) if (ext.prf.eval[k]) ext.prf.eval[k] = unb64u(ext.prf.eval[k]); }
}
function decodeCreation(pk) {
  pk.challenge = unb64u(pk.challenge); pk.user.id = unb64u(pk.user.id);
  for (const c of pk.excludeCredentials || []) c.id = unb64u(c.id);
  decodePrf(pk.extensions); return pk;
}
function decodeRequest(pk) {
  pk.challenge = unb64u(pk.challenge);
  for (const c of pk.allowCredentials || []) c.id = unb64u(c.id);
  decodePrf(pk.extensions); return pk;
}
function credToJSON(c) {
  const r = c.response;
  const out = {id: c.id, rawId: b64u(c.rawId), type: c.type, authenticatorAttachment: c.authenticatorAttachment,
               clientExtensionResults: extToJSON(c.getClientExtensionResults()), response: {clientDataJSON: b64u(r.clientDataJSON)}};
  if (r.attestationObject) {
    out.response.attestationObject = b64u(r.attestationObject);
    out.transports = r.getTransports ? r.getTransports() : null;
    const cs = {};
    try { cs.getPublicKeyAlgorithm = r.getPublicKeyAlgorithm ? r.getPublicKeyAlgorithm() : 'not implemented'; } catch (e) { cs.getPublicKeyAlgorithm = `${e.name}: ${e.message}`; }
    try { const pk = r.getPublicKey ? r.getPublicKey() : undefined; cs.getPublicKey = pk === undefined ? 'not implemented' : pk === null ? null : `${pk.byteLength} bytes SPKI`; } catch (e) { cs.getPublicKey = `${e.name}: ${e.message}`; }
    try { const j = c.toJSON ? c.toJSON() : null; cs.toJSON_publicKey = j ? (j.response.publicKey === undefined ? 'absent' : j.response.publicKey === null ? null : `${j.response.publicKey.length} b64u chars`) : 'no toJSON'; } catch (e) { cs.toJSON_publicKey = `${e.name}: ${e.message}`; }
    out.clientSide = cs;
  } else {
    out.response.authenticatorData = b64u(r.authenticatorData);
    out.response.signature = b64u(r.signature);
    out.response.userHandle = r.userHandle ? b64u(r.userHandle) : null;
  }
  return out;
}
async function post(path, body) {
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

let abortCtl = null;
function busy(on, text) {
  $('status').textContent = text; abortCtl = on ? new AbortController() : null;
  $('btnAbort').disabled = !on; $('btnReg').disabled = on; $('btnLogin').disabled = on;
}
function show(res) {
  window.pqkeyLastResult = res;
  const cls = res.outcome === 'PASS' ? 'PASS' : res.outcome === 'FAIL' ? 'FAIL' : 'ERR';
  $('result').innerHTML = `<span class="${cls}">${res.outcome}</span>  ${escapeHtml(res.label || '')}\n${escapeHtml(res.summary || '')}\n\n` + escapeHtml(JSON.stringify(res.checks || res, null, 1));
  refresh();
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function ceremony(kind, cfg) {
  const t0 = performance.now();
  busy(true, `${kind}: waiting for the key…`);
  let opt;
  let stage = "options";
  try {
    opt = await post(kind === 'reg' ? '/api/register/options' : '/api/login/options', cfg);
    stage = 'webauthn';
    const cred = kind === 'reg'
      ? await navigator.credentials.create({publicKey: decodeCreation(opt.publicKey), signal: abortCtl.signal})
      : await navigator.credentials.get({publicKey: decodeRequest(opt.publicKey), signal: abortCtl.signal});
    const elapsed = Math.round(performance.now() - t0);
    busy(true, `${kind}: verifying…`);
    stage = 'verification';
    const res = await post(kind === 'reg' ? '/api/register/verify' : '/api/login/verify',
                           {ceremonyId: opt.ceremonyId, credential: credToJSON(cred), ua: navigator.userAgent, elapsed_ms: elapsed});
    show(res);
  } catch (e) {
    const elapsed = Math.round(performance.now() - t0);
    try {
      show(await post('/api/client-error', {ceremonyId: opt && opt.ceremonyId, kind: kind === 'reg' ? 'register' : 'login',
           label: cfg.label, fixtureId: cfg.fixtureId, stage, name: e.name, message: e.message, elapsed_ms: elapsed, ua: navigator.userAgent}));
    } catch (e2) { $('result').textContent = `${e.name}: ${e.message}\n(server: ${e2})`; }
  } finally { busy(false, 'idle'); }
}

async function refresh() {
  const db = await (await fetch('/api/db')).json();
  let html = '<table><tr><th>user</th><th>alg</th><th>kind</th><th>signCount</th><th>made</th><th></th></tr>';
  for (const [name, u] of Object.entries(db.users)) {
    for (const c of u.credentials) {
      html += `<tr><td>${escapeHtml(name)}</td><td>${NAMES[c.alg] || c.alg}</td><td>${c.disc ? 'discoverable' : 'non-disc'}${c.credProtect ? ' cp' + c.credProtect : ''}</td>` +
              `<td>${c.signCount}</td><td title="${escapeHtml(c.browser || '')}">${c.created}<br><span class="ua">${escapeHtml(c.label || '')}</span></td>` +
              `<td><button data-id="${escapeHtml(c.id)}" data-u="${escapeHtml(name)}" data-uv="discouraged" class="si">Sign in</button> ` +
              `<button data-id="${escapeHtml(c.id)}" data-u="${escapeHtml(name)}" data-uv="required" class="si">Sign in + UV</button> ` +
              `<button data-id="${escapeHtml(c.id)}" class="fg">Forget</button></td></tr>`;
    }
  }
  $('creds').innerHTML = html + '</table>';
  for (const b of document.querySelectorAll('button.si')) b.onclick = () => {
    const cfg = {...readForm(), username: b.dataset.u, allow: 'cred:' + b.dataset.id, userVerification: b.dataset.uv,
                 label: `sign in ${b.dataset.u} ${b.closest('tr').children[1].textContent} ${b.closest('tr').children[2].textContent} UV ${b.dataset.uv}`};
    ceremony('login', cfg);
  };
  for (const b of document.querySelectorAll('button.fg')) b.onclick = async () => { await post('/api/forget', {id: b.dataset.id, label: 'forget ' + b.dataset.id.slice(0, 10)}); refresh(); };
  const log = await (await fetch('/api/results')).json();
  $('log').innerHTML = log.map(e => `<div><span class="${e.outcome === 'PASS' ? 'PASS' : e.outcome === 'FAIL' ? 'FAIL' : 'ERR'}">${escapeHtml(e.outcome)}</span> ` +
    `${escapeHtml(e.time.slice(11, 19))} ${escapeHtml(e.label || '')} — ${escapeHtml(e.summary || '')}</div>`).join('');
}

for (const p of PRESETS) {
  const b = document.createElement('button');
  b.dataset.preset = p.id;
  b.innerHTML = `<b>${p.id}</b> ${escapeHtml(p.label)}`;
  b.onclick = () => { setForm(p); ceremony(p.kind, readForm()); };
  $('presets').appendChild(b);
}
$('btnReg').onclick = () => ceremony('reg', readForm());
$('btnLogin').onclick = () => ceremony('login', readForm());
$('btnAbort').onclick = () => abortCtl && abortCtl.abort();
refresh();

// Remote control: the tester queues presets or full configs on the server; this page runs them one at a time.
const FAMILY = /firefox/i.test(navigator.userAgent) ? 'firefox' : 'chrome';
let running = false;
async function poll() {
  if (!$('remote').checked || running || abortCtl) return;
  let item;
  try { item = (await (await fetch('/api/next?' + FAMILY)).json()).item; } catch (e) { return; }
  if (!item) return;
  running = true;
  try {
    if (item.wait_ms) { $('status').textContent = item.note || `waiting ${item.wait_ms} ms`; await new Promise(r => setTimeout(r, item.wait_ms)); }
    else if (item.abort_after_ms) {
      const p = PRESETS.find(x => x.id === item.preset); setForm(p); if (item.label) $('label').value = item.label;
      const run = ceremony(p.kind, readForm());
      setTimeout(() => abortCtl && abortCtl.abort(), item.abort_after_ms);
      await run;
    }
    else if (item.preset) { const p = PRESETS.find(x => x.id === item.preset); setForm(p); if (item.label) $('label').value = item.label; await ceremony(p.kind, readForm()); }
    else if (item.kind) { await ceremony(item.kind, {...readForm(), ...item.cfg}); }
  } finally { running = false; }
}
// Test-only form loading still requires a real button click to start WebAuthn.
window.pqkeyLoadForm = setForm;
window.pqkeyPresets = PRESETS;
window.pqkeyReady = true;
setInterval(poll, 1000);
</script>
</body>
</html>
