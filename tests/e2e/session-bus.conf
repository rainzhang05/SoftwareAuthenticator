<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  A private session bus for the end-to-end tests (see .github/workflows/e2e.yml).
  Unlike the system's session bus configuration it names no service
  directories, so no notification server installed on the machine can be
  started by D-Bus activation: the only one on this bus is the tests' fake.
  The listen address is overridden with dbus-daemon's address option.
-->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
