# cargo-deny configuration.
#
# Run locally with:
#     cargo install cargo-deny --locked
#     cargo deny check
#
# CI runs this from .github/workflows/security.yml. cargo-deny is version-pinned
# there on purpose: its config schema changes between minor releases, so bump the
# pin and this file together.
#
# This file is the *source of truth* for which known findings are tolerated.
# Should a vulnerability ever need to be ignored here, mirror it into a
# `cargo audit --ignore` flag in .github/workflows/security.yml; none is today.

[graph]
# Check the dependency graph with every feature enabled. pqkey-mldsa's `log`
# and mldsa44/65/87 features are optional, and an advisory hiding behind an
# off-by-default feature is still an advisory.
all-features = true
# Deliberately NOT restricted with `targets = [...]`: filtering the graph by
# target would hide advisories in platform-specific dependencies.

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# advisories - RustSec advisory database
# ---------------------------------------------------------------------------
# This is the strict gate. Every advisory kind fails the build unless it is
# enumerated in `ignore` below, so a NEW advisory landing on any dependency
# turns CI red even though the known ones are tolerated.
#
# `cargo audit` in the same workflow runs with its own defaults (vulnerabilities
# fail, informational advisories are printed as warnings). It is the readable
# report; this is the gate.
[advisories]
unmaintained = "all"
# Stricter than cargo-deny's default of "workspace": flag unsound advisories on
# transitive dependencies too, not just direct ones.
unsound = "all"
# Left at the default. A crate can be yanked upstream overnight through no fault
# of this repo; that should be loud, not a hard stop on every open PR.
yanked = "warn"

ignore = [
    # --- unmaintained / unsound -----------------------------------------
    # atomic-polyfill 1.0.3 <- heapless 0.7 <- postcard 0.7 <- trussed-core 0.2
    # (every release up to 0.2.2) <- ctaphid-app 0.2. Only compiled for targets
    # without atomics, never for the Linux daemon. Goes away with a
    # trussed-core release on postcard 1.
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill via postcard 0.7 in trussed-core; not built on targets with atomics" },
]

# ---------------------------------------------------------------------------
# licenses
# ---------------------------------------------------------------------------
# The workspace itself is "MIT"; the list below is what its dependencies may
# be under, which is a wider set. Under cargo-deny's current semantics every
# license is denied unless listed here, so copyleft (GPL/AGPL/LGPL/MPL/CDDL/
# EPL/SSPL) and unrecognised licenses fail automatically - there is no separate
# "copyleft = deny" knob to set.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The list above is the usual permissive set rather than the exact set the tree
# happens to use today, so don't nag about entries nothing currently needs.
unused-allowed-license = "allow"
# The fuzz crate (fuzz/, a workspace of its own that security.yml checks
# against this same file) links LLVM's libFuzzer, part of which is under the
# permissive NCSA license. The fuzz targets are never distributed.
exceptions = [
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
]
# The main workspace does not contain libfuzzer-sys.
unused-license-exception = "allow"
# Every workspace member sets `publish = false`, and is licensed through
# `license.workspace = true` anyway.
private = { ignore = true }

# ---------------------------------------------------------------------------
# bans
# ---------------------------------------------------------------------------
[bans]
# Duplicated crates are a real hazard in an authenticator: two copies of sha2 or
# p256 mean two code paths, two audit surfaces and larger binaries. A second
# version of anything fails the check; each exception below names the crate
# that forces it and is removed once that crate moves on.
multiple-versions = "deny"
skip = [
    # trussed-core (through ctaphid-app, every release up to 0.2.2) requires
    # rand_core 0.6; everything else is on 0.10. Compiled, but pqkey never
    # calls into it: it only uses trussed-core's `InterruptFlag`.
    { crate = "rand_core@0.6", reason = "trussed-core requires rand_core 0.6" },
    # trussed-core 0.2 serializes with postcard 0.7, which is still on
    # heapless 0.7 (and its hash32 0.2), while heapless-bytes 0.5 uses
    # heapless 0.9. Goes away with a trussed-core release on postcard 1.
    { crate = "heapless@0.7", reason = "postcard 0.7 via trussed-core" },
    { crate = "hash32@0.2", reason = "heapless 0.7 via postcard 0.7 and trussed-core" },
    # Build time only: proc macros (zeroize_derive, serde-indexed via
    # trussed-core, zerocopy-derive, enumflags2_derive, x509-parser's asn1-rs
    # derives, ...) that have not moved to syn 3 yet.
    { crate = "syn@2", reason = "proc-macro crates that still use syn 2" },
]

# Path dependencies between workspace members carry no version, which reads as
# a wildcard. Every member sets `publish = false`, so they are allowed; a
# wildcard on a registry dependency is not.
wildcards = "deny"
allow-wildcard-paths = true

[bans.workspace-dependencies]
# A crate used by more than one member is declared once in the root
# Cargo.toml's [workspace.dependencies] and inherited with `workspace = true`.
duplicates = "deny"
unused = "deny"

# ---------------------------------------------------------------------------
# sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
# No git sources are allowed today. Should one ever be needed, require it to pin
# an exact commit: a bare branch dependency is an unpinned wildcard on somebody
# else's repo.
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
