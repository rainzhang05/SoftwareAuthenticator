# cargo-deny configuration.
#
# Run locally with:
#     cargo install cargo-deny --locked
#     cargo deny check
#
# CI runs this from .github/workflows/security.yml. cargo-deny is version-pinned
# there on purpose: its config schema changes between minor releases, so bump the
# pin and this file together.
#
# This file is the *source of truth* for which known findings are tolerated.
# Should a vulnerability ever need to be ignored here, mirror it into a
# `cargo audit --ignore` flag in .github/workflows/security.yml; none is today.

[graph]
# Check the dependency graph with every feature enabled. transport-core's
# `ctaphid` transport and trussed-mldsa's `log` / mldsa44/65/87 features are all
# optional, and an advisory hiding behind an off-by-default feature is still an
# advisory.
all-features = true
# Deliberately NOT restricted with `targets = [...]`: filtering the graph by
# target would hide advisories in platform-specific dependencies.

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# advisories - RustSec advisory database
# ---------------------------------------------------------------------------
# This is the strict gate. Every advisory kind fails the build unless it is
# enumerated in `ignore` below, so a NEW advisory landing on any dependency
# turns CI red even though the known ones are tolerated.
#
# `cargo audit` in the same workflow runs with its own defaults (vulnerabilities
# fail, informational advisories are printed as warnings). It is the readable
# report; this is the gate.
[advisories]
unmaintained = "all"
# Stricter than cargo-deny's default of "workspace": flag unsound advisories on
# transitive dependencies too, not just direct ones.
unsound = "all"
# Left at the default. A crate can be yanked upstream overnight through no fault
# of this repo; that should be loud, not a hard stop on every open PR.
yanked = "warn"

ignore = [
    # --- unmaintained / unsound -----------------------------------------
    # atomic-polyfill 1.0.3 <- heapless 0.7. Goes away with heapless 0.8, which
    # is a breaking change across trussed/authenticator/transport-core.
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill via heapless 0.7; needs a coordinated heapless 0.8 upgrade" },
]

# ---------------------------------------------------------------------------
# licenses
# ---------------------------------------------------------------------------
# The workspace is "Apache-2.0 OR MIT". Under cargo-deny's current semantics
# every license is denied unless listed here, so copyleft (GPL/AGPL/LGPL/MPL/
# CDDL/EPL/SSPL) and unrecognised licenses fail automatically - there is no
# separate "copyleft = deny" knob to set.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The list above is the usual permissive set rather than the exact set the tree
# happens to use today, so don't nag about entries nothing currently needs.
unused-allowed-license = "allow"
# Workspace members that are never published don't need a license expression.
# Note: this only takes effect for crates marked `publish = false`; see the
# clarifications below for why transport-core / pc-hid-runner still need one.
private = { ignore = true }

# transport-core and pc-hid-runner declare no `license` at all: the root
# Cargo.toml sets `license = "Apache-2.0 OR MIT"` under [workspace.package], but
# these two members never inherit it with `license.workspace = true`.
# `license-files = []` makes the clarification apply unconditionally.
# TODO: delete both entries once the member manifests inherit the workspace
# license (that also makes `private.ignore` above do the right thing).
[[licenses.clarify]]
crate = "transport-core"
expression = "Apache-2.0 OR MIT"
license-files = []

[[licenses.clarify]]
crate = "pc-hid-runner"
expression = "Apache-2.0 OR MIT"
license-files = []

# ---------------------------------------------------------------------------
# bans
# ---------------------------------------------------------------------------
[bans]
# The tree currently carries duplicated major versions of crypto crates, all
# pulled in by the patched trussed (p256-cortex-m4 depends on the 2021-era
# RustCrypto generation):
#
#   p256       0.9.0  + 0.13.2
#   sha2       0.9.9  + 0.10.9
#   hmac       0.11.0 + 0.12.1
#
# Duplicated crypto crates are a real hazard in an authenticator: two copies of
# sha2 or p256 means two code paths, two audit surfaces, and larger binaries.
# Kept at "warn" so CI is not red on day one.
# TODO: switch to "deny" once the dependency cleanup unifies these. That single
# word is the whole change.
multiple-versions = "warn"

# Path dependencies between workspace members are version-less, which reads as a
# wildcard. Left at the default until the members set `publish = false` (at which
# point `allow-wildcard-paths = true` would let this become "deny").
wildcards = "warn"

[bans.workspace-dependencies]
# Members declare serde / sha2 / log / littlefs2 / trussed / heapless-bytes
# independently instead of via [workspace.dependencies] + `workspace = true`,
# which is how the duplicate versions above crept in. cargo-deny denies this by
# default; downgraded to a warning until the manifests are unified.
# TODO: add [workspace.dependencies] to the root Cargo.toml, then set both of
# these back to "deny".
duplicates = "warn"
unused = "warn"

# ---------------------------------------------------------------------------
# sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
# No git sources are allowed today. Should one ever be needed, require it to pin
# an exact commit: a bare branch dependency is an unpinned wildcard on somebody
# else's repo.
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
